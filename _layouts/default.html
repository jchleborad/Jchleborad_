<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ page.title }} – JChleborad</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="John Chleborad">
  <meta name="description" content="A personal Bio of John Chleborad">
  <meta name="keywords" content="John Chleborad, …">

  <!-- Bootstrap 4.6.2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <!-- Your Site CSS -->
  <link rel="stylesheet" href="/css/site.css">
  <link rel="shortcut icon" href="/images/favicons/favicon-c.png" type="image/x-icon" />

  <!-- jQuery + Bootstrap Bundle -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- FontAwesome 6 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!--Comfortaa Font-->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" >

</head>
<body style="padding:0%">
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img class="logo" src="/images/logos/jchleborad-logo.png" width="170">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
          <span class="navbar-toggler-icon"></span>
        </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          {% unless page.navbar_minimal %}
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/views/cindyandme.html/' %}active-link{% endif %}" href="/cindyandme/">Cindy & Me</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/views/project605.html' %}active-link{% endif %}" href="/project605/">Project605&trade;</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/views/cycling.html' %}active-link{% endif %}" href="/cycling/">Cycling</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/views/about.html' %}active-link{% endif %}" href="/about/">About</a>
            </li>
          {% endunless %}

              <li class="nav-item">
                <a class="nav-link" href="/">Home</a>
              </li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- yield the page’s content here -->
  {{ content }}

<script>
  $(document).ready(function () {
    $('#projectTabs a').click(function (e) {
      e.preventDefault();
      $(this).tab('show');
    });
  });
</script>
</body>
</html>

</body>
</html>
